<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- faint shuriken backdrop -->
  <g transform="translate(1035,150) rotate(15)" opacity="0.08">
    <path d="M0,-95 L18,-18 L95,0 L18,18 L0,95 L-18,18 L-95,0 L-18,-18 Z" fill="#f8fafc"/>
  </g>
  <g transform="translate(1130,60) rotate(-20) scale(0.55)" opacity="0.06">
    <path d="M0,-95 L18,-18 L95,0 L18,18 L0,95 L-18,18 L-95,0 L-18,-18 Z" fill="#f8fafc"/>
  </g>

  <!-- ninja mark, matching the extension icon -->
  <g transform="translate(150,150)">
    <clipPath id="round">
      <rect x="-88" y="-88" width="176" height="176" rx="36"/>
    </clipPath>
    <g clip-path="url(#round)">
      <rect x="-88" y="-88" width="176" height="176" fill="#0f172a"/>
      <rect x="-88" y="-56" width="176" height="28" fill="url(#band)"/>
      <rect x="-88" y="-34" width="46" height="14" fill="#dc2626"/>
      <rect x="-64" y="-34" width="22" height="14" fill="#dc2626"/>
      <rect x="-62" y="-10" width="46" height="14" fill="#f8fafc"/>
      <rect x="16" y="-10" width="46" height="14" fill="#f8fafc"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="290" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="86" font-weight="700" fill="#f8fafc">Window Ninja</text>
  <text x="292" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#94a3b8">Slip past site restrictions. Strike with DOM power tools.</text>

  <!-- red accent rule -->
  <rect x="292" y="170" width="180" height="5" rx="2.5" fill="url(#band)"/>
</svg>
